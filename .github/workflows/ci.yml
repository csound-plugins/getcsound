name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install getcsound
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run unit tests
        run: python -m pytest -v

  integration:
    name: getcsound -> libcsound (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: windows-x86_64
            os: windows-2022
            arch: AMD64
    env:
      # Allow the bundled installer to query the GitHub API without hitting
      # anonymous rate limits (needed on macOS, harmless elsewhere).
      GH_TOKEN: ${{ github.token }}
      GETCSOUND_RUN_LIBCSOUND_INTEGRATION: "1"
      GETCSOUND_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install getcsound and libcsound
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" libcsound
      - name: Install Csound with getcsound, then verify libcsound
        run: python -m pytest -v -s tests/test_integration_libcsound.py
