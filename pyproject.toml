[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "getcsound"
dynamic = ["version"]
description = "Install Csound 7 from Python, with no runtime dependencies"
authors = [
    { name = "Eduardo Moguillansky", email = "eduardo.moguillansky@gmail.com" },
]
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.9"
keywords = ["csound", "installer", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Build Tools",
]

# getcsound is intentionally dependency-free: the standard library only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/csound-plugins/getcsound"

[tool.setuptools]
packages = ["getcsound"]

[tool.setuptools.package-data]
getcsound = ["data/*.sh", "data/*.ps1", "py.typed"]

[tool.setuptools_scm]
# Versions come from git tags. Cut a release with:
#     git tag 0.1.0 && git push --tags
# fallback_version only applies when building from a tree without git
# metadata (e.g. a GitHub "Download ZIP" archive); sdists carry the frozen
# version in PKG-INFO and are unaffected.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
